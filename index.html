<style>
:root{
  --band:#9A3412; --head:#C2410C; --amber:#F59E0B; --badge:#FDE68A; --cream:#FFFBEB; --brown:#7C2D12;
  --ink:#2B1D14; --ink2:#5B4636; --muted:#8A7563; --line:#EAD9C4; --paper:#FBF7F2; --card:#FFFFFF;
  --link:#1B6EC2; --red:#9B2226; --redbg:#FBE9E9; --green:#1E6B45; --greenbg:#E5F3EA; --blue:#1F3F94; --bluebg:#E8EDFA;
  --r:10px;
  font-family:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  color:var(--ink); background:var(--paper);
}
*{box-sizing:border-box}
body{margin:0;font-size:15px;line-height:1.5;padding-bottom:env(safe-area-inset-bottom,0px)}
h1,h2,h3{margin:0;line-height:1.2}
a{color:var(--link)}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--band);background:var(--band);color:#fff;padding:7px 12px;font-weight:600}
button.ghost{background:#fff;color:var(--band)}
button.small{padding:3px 9px;font-size:.82rem}
button.link{background:none;border:none;color:var(--link);padding:0;font-weight:600;text-decoration:underline}
button.x{background:none;border:none;color:var(--muted);padding:2px 6px;font-size:1.05rem;line-height:1}
button:disabled{opacity:.5;cursor:default}
input,select,textarea{font:inherit;color:var(--ink);background:#fff;border:1px solid #D9C3A7;border-radius:8px;padding:7px 9px;width:100%;min-width:0;max-width:100%}
textarea{resize:vertical;min-height:62px;line-height:1.45}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid #F8B26A;outline-offset:1px}
label{display:block;font-size:.8rem;font-weight:650;color:var(--ink2);margin:8px 0 3px}
.hint{font-size:.8rem;color:var(--muted);margin:4px 0 0}
.band{background:var(--band);color:#fff;padding:8px 18px 0;padding-top:calc(8px + env(safe-area-inset-top,0px))}
.band .l1{font-size:.78rem;font-weight:700;letter-spacing:.04em;text-align:center}
.band .l2{background:var(--amber);color:var(--brown);font-size:.74rem;font-weight:800;letter-spacing:.05em;text-align:center;margin:6px -18px 0;padding:3px 10px}
.topbar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;padding:10px 18px;background:#fff;border-bottom:1px solid var(--line)}
.topbar h1{font-size:1.2rem;color:var(--band)}
.topbar .tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pill{display:inline-block;font-size:.74rem;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--badge);color:var(--brown);white-space:nowrap}
.pill.g{background:var(--greenbg);color:var(--green)} .pill.r{background:var(--redbg);color:var(--red)} .pill.b{background:var(--bluebg);color:var(--blue)} .pill.m{background:#F1ECE6;color:var(--ink2)}
.banner{margin:12px 18px 0;padding:9px 12px;border-radius:8px;background:var(--cream);border:1px solid #F3D9A4;color:var(--brown);font-size:.88rem;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.app{display:grid;grid-template-columns:290px 1fr;gap:16px;padding:14px 18px 60px;max-width:1500px;margin:0 auto;align-items:start}
.app>*{min-width:0}
@media (max-width:900px){.app{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:14px}
.card>h2{font-size:1rem;color:var(--head);margin-bottom:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card>h2 .sp{margin-left:auto}
aside .card{position:sticky;top:10px}
@media (max-width:900px){aside .card{position:static}}
.plist{list-style:none;margin:8px 0 0;padding:0;max-height:65vh;overflow:auto}
.plist li{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:6px;cursor:pointer;background:#fff}
.plist li:hover{border-color:var(--amber)}
.plist li.on{border-color:var(--band);background:var(--cream)}
.plist .n{font-weight:650}
.plist .m{font-size:.78rem;color:var(--muted)}
.empty{padding:20px;border:1px dashed #E2C7A6;border-radius:var(--r);background:#fff;color:var(--ink2)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0 10px}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;border-bottom:1px solid var(--line);padding:7px 0;font-size:.88rem}
.tl li.on{background:var(--cream)}
.tl .d{font-weight:700;min-width:120px}
.tl .s{color:var(--ink2);flex:1;min-width:180px}
.sticky{position:sticky;top:0;z-index:5;background:var(--paper);padding:8px 0;margin-bottom:6px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-bottom:1px solid var(--line)}
.saved{font-size:.78rem;color:var(--muted)}
.mic{display:inline-flex;gap:8px;align-items:center}
.mic button.rec{background:var(--red);border-color:var(--red)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--red);display:inline-block;animation:pulse 1.2s infinite}
@keyframes pulse{0%{opacity:1}50%{opacity:.25}100%{opacity:1}}
.interim{font-size:.85rem;color:var(--muted);font-style:italic;min-height:1.2em;margin-top:4px}
.sumbox{margin-top:8px;padding:8px 10px;border-radius:8px;background:var(--greenbg);color:var(--green);font-size:.85rem}
.sec{margin-top:12px}
.sec>label:not(.chk){font-size:.85rem;color:var(--head)}
.tbl{width:100%;border-collapse:collapse;font-size:.85rem}
.tblwrap{overflow-x:auto}
.tbl th{font-size:.74rem;text-align:left;color:var(--brown);background:var(--badge);padding:5px 6px}
.tbl td{padding:3px 4px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl td input{padding:5px 6px;font-size:.85rem}
.tbl.ro td{padding:5px 6px}
.vit{display:grid;grid-template-columns:repeat(5,minmax(80px,1fr));gap:0 8px}
@media (max-width:560px){.vit{grid-template-columns:repeat(2,1fr)}}
.refl{list-style:none;margin:6px 0 0;padding:0;font-size:.85rem}
.refl li{display:flex;gap:8px;align-items:flex-start;border-bottom:1px solid var(--line);padding:6px 0}
.refl li .t{flex:1;min-width:0;overflow-wrap:anywhere}
.refl .src{font-size:.7rem;font-weight:700;color:var(--muted);text-transform:uppercase;white-space:nowrap}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:.85rem;margin:4px 0}
.chk input{width:16px;height:16px;margin-top:3px;accent-color:var(--band);flex:0 0 auto}
details.lib{border:1px solid var(--line);border-radius:8px;padding:0 10px;margin-top:8px;background:#FFFDF9}
details.lib summary{cursor:pointer;padding:8px 0;font-weight:650;font-size:.88rem}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.prev{background:var(--cream);border:1px solid #F3D9A4;border-radius:8px;padding:10px 12px;font-size:.88rem}
.prev h3{font-size:.9rem;color:var(--brown);margin-bottom:4px}
.prev .blk{white-space:pre-wrap;margin:2px 0 6px}
.ro textarea,textarea[readonly],input[readonly]{background:#F7F2EC}
dialog{border:none;border-radius:12px;padding:0;max-width:min(760px,96vw);width:100%;box-shadow:0 18px 60px rgba(43,29,20,.35)}
dialog::backdrop{background:rgba(43,29,20,.45)}
.dlg-h{background:var(--band);color:#fff;padding:10px 16px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.dlg-h button{background:none;border:none;color:#fff;font-size:1.3rem;padding:0 4px}
.dlg-b{padding:14px 16px;max-height:72vh;overflow:auto}
.dlg-f{padding:10px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
#lock{position:fixed;inset:0;background:var(--paper);display:none;z-index:50;align-items:center;justify-content:center;padding:20px}
#lock.show{display:flex}
#lock .card{max-width:420px;width:100%}
.res{list-style:none;padding:0;margin:8px 0 0;font-size:.85rem}
.res li{border-bottom:1px solid var(--line);padding:7px 0;display:flex;gap:8px;align-items:flex-start}
.res li .t{flex:1;min-width:0}
.res .j{color:var(--muted);font-size:.78rem}
.err{color:var(--red);font-size:.85rem}
#printArea{display:none}
.chips{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin:6px 0}
.chip{display:inline-flex;gap:6px;align-items:center;border:1px solid #E5C9A8;border-radius:99px;padding:3px 10px;font-size:.82rem;background:#fff;cursor:pointer}
.chip input{width:15px;height:15px;accent-color:var(--band);margin:0}
.chip.auto{background:var(--cream)}
.og{margin:10px 0 2px;font-weight:700;font-size:.78rem;color:var(--brown);text-transform:uppercase;letter-spacing:.03em}
.ref-a{font-size:.74rem;white-space:nowrap}
.items{list-style:none;margin:4px 0;padding:0}
.items li{display:flex;gap:6px;align-items:flex-start;margin-bottom:4px}
.items li .src{font-size:.68rem;font-weight:700;color:var(--muted);text-transform:uppercase;white-space:nowrap;margin-top:8px;min-width:46px}
.items textarea{min-height:34px;padding:5px 8px;font-size:.88rem;field-sizing:content}
.pcat{margin:6px 0 8px;padding-left:8px;border-left:3px solid var(--badge)}
.pcat>b{font-size:.82rem;color:var(--brown)}
.adn{border:1px solid var(--line);border-left:4px solid var(--amber);border-radius:8px;padding:8px 10px;margin:8px 0;background:#FFFDF9}
.adh{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:.86rem}
.adn .blk{white-space:pre-wrap;font-size:.88rem;margin:6px 0}
.adform{border:1px dashed var(--amber);border-radius:8px;padding:10px;margin-top:10px;background:var(--cream)}
@media print{
  html,body,:root{background:#fff!important}
  .band,.topbar,.banner,.app,#lock,dialog{display:none!important}
  #printArea{display:block;font-size:10.5pt;color:#111}
  @page{size:A4;margin:14mm 13mm 16mm}
}
#printArea .pb1{background:#9A3412;color:#fff;text-align:center;font-weight:700;font-size:9pt;padding:3px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
#printArea .pb2{background:#F59E0B;color:#7C2D12;text-align:center;font-weight:800;font-size:8.5pt;padding:2px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
#printArea .pt{background:#9A3412;color:#fff;font-weight:700;font-size:14pt;padding:5px 8px;margin:10px 0 8px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
#printArea h2{color:#C2410C;font-size:11.5pt;border-bottom:2px solid #F59E0B;padding-bottom:2px;margin:12px 0 5px;break-after:avoid}
#printArea table{width:100%;border-collapse:collapse;margin:4px 0 8px;font-size:9pt;break-inside:auto}
#printArea th{background:#FDE68A;color:#7C2D12;text-align:left;padding:3px 5px;border:1px solid #E5C9A8;-webkit-print-color-adjust:exact;print-color-adjust:exact}
#printArea td{padding:3px 5px;border:1px solid #E5C9A8;vertical-align:top}
#printArea td.k{color:#7C2D12;font-weight:700;width:30%}
#printArea p{margin:3px 0 5px;white-space:pre-wrap}
#printArea ol{padding-left:18px;font-size:9pt} #printArea ol li{margin-bottom:3px;overflow-wrap:anywhere}
#printArea ul{padding-left:18px;margin:3px 0}
#printArea .note{background:#FFFBEB;color:#7C2D12;font-style:italic;font-size:8.5pt;padding:5px 7px;margin-top:10px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
#printArea .ft{font-size:8pt;color:#6B5A4E;text-align:center;margin-top:12px;border-top:1px solid #E5C9A8;padding-top:4px}
@media (max-width:560px){.app{padding:10px 10px 50px}.band{padding-left:10px;padding-right:10px}.band .l2{margin-left:-10px;margin-right:-10px}.topbar{padding:8px 10px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

function optList(topic){ const o=OPTS[topic]; if(!o) return []; const out=[];

function optById(id){ const p=String(id||'').split('.'); return optList(p[0]).find(x=>x.id===id)||null; }
const nf=(x,dec)=>{ const v=dec==null?(x>=10?Math.round(x):Math.round(x*10)/10):Number(x.toFixed(dec)); return v.toLocaleString('tr-TR',{maximumFractionDigits:2}); };
function fmtAmt(x,u){ if(u==='U') return (Math.round(x/1000)*1000).toLocaleString('tr-TR'); if(u==='mL') return String(Math.round(x)); return nf(x); }
function fmtMax(m,u,per){ return (u==='mg'&&m>=1000? nf(m/1000)+' g' : nf(m)+' '+u)+'/'+per; }
function rng(a,b,f){ return b!=null&&b!==a? f(a)+'–'+f(b) : f(a); }
function doseOne(d,w,u0){
  const u=d.u||u0||'mg', ul=d.ul||u; const per=d.per||'gün';
  const reg=rng(d.lo,d.hi,x=>x.toLocaleString('tr-TR',{maximumFractionDigits:3}))+' '+ul+'/kg'+(d.pl?' '+d.pl:'/'+per)+(d.freq?', '+d.freq:'')+(d.max?' (maks. '+fmtMax(d.max,u,d.maxPer||per)+')':'');
  if(!(w>0)) return {reg,calc:''};
  let dl,dh,pl,ph,cap=false; const hi=d.hi!=null?d.hi:d.lo;
  const capd=(a,b,m)=>{ if(m&&b>m){ cap=true; b=m; if(a>m) a=m; } return [a,b]; };
  if(per==='gün'){ dl=d.lo*w; dh=hi*w; if(d.maxPer!=='doz') [dl,dh]=capd(dl,dh,d.max); if(d.div){ pl=dl/d.div; ph=dh/d.div; if(d.maxPer==='doz') [pl,ph]=capd(pl,ph,d.max); } }
  else { pl=d.lo*w; ph=hi*w; if(d.maxPer==='doz'||!d.maxPer) [pl,ph]=capd(pl,ph,d.maxPer==='doz'?d.max:null); if(d.div){ dl=pl*d.div; dh=ph*d.div; if(d.maxPer==='gün') [dl,dh]=capd(dl,dh,d.max); } }
  const f=x=>fmtAmt(x,u); const parts=[];
  if(d.pl){ parts.push(rng(pl,ph,f)+' '+ul+' '+d.pl); }
  else { if(dl!=null&&per==='gün') parts.push(rng(dl,dh,f)+' '+ul+'/gün'); if(pl!=null&&!(per==='gün'&&d.div===1)) parts.push(rng(pl,ph,f)+' '+ul+'/doz'); if(dl!=null&&per==='doz'&&d.div>1) parts.push(rng(dl,dh,f)+' '+ul+'/gün'); }
  return {reg,calc:parts.join(' = ')+(cap?' (maksimum doza sınırlandı)':'')};
}
function doseText(d,w){
  if(!d) return '';
  const W=parseFloat(String(w==null?'':w).replace(',','.'));

function lc(s){ return String(s||'').toLocaleLowerCase('tr-TR'); }
const WORDCH='a-zçğıöşüâîû0-9';
function escRx(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }
function wordRx(alias,flags){ return new RegExp('(^|[^'+WORDCH+'])('+escRx(alias)+')(?=$|[^'+WORDCH+'])',flags||'g'); }

// Konuşma metnini normalleştir: sesli noktalama komutları ve ondalık
function normalizeSpeech(text){
  let s=String(text||'').replace(/\r/g,'');
  s=s.replace(/(\d)\s+virgül\s+(\d)/gi,'$1,$2');
  s=s.replace(/(\d)\s+nokta\s+(\d)/gi,'$1.$2');
  s=s.replace(/\s*\b(yeni satır|alt satır|yeni paragraf)\b\s*/gi,'\n');
  s=s.replace(/\s*\biki nokta( üst üste)?\b\s*/gi,': ');
  s=s.replace(/\s*\bnokta\b\s*/gi,'. ');
  s=s.replace(/\s*\bvirgül\b\s*/gi,', ');
  s=s.replace(/\s*\bsoru işareti\b\s*/gi,'? ');
  s=s.replace(/(\d+)\s*bölü\s*(\d+)/gi,'$1/$2');
  s=s.replace(/\byüzde\s*(\d+(?:[.,]\d+)?)/gi,'%$1');
  s=s.replace(/[ \t]+/g,' ').replace(/ +\n/g,'\n').replace(/\n +/g,'\n');
  return s.trim();
}
function capFirst(s){ s=s.trim(); return s? s.charAt(0).toLocaleUpperCase('tr-TR')+s.slice(1):s; }
function parseNum(raw){
  if(raw==null) return null; let s=String(raw).trim();
  if(/^\d{1,3}(\.\d{3})+$/.test(s)) s=s.replace(/\./g,'');
  s=s.replace(',','.'); const v=parseFloat(s); return isNaN(v)?null:v;
}
function fmtNum(v){ return v==null?'':String(v).replace('.',','); }

// Bölümlere ayır: cümle/ifade başındaki başlık kelimeleri, ya da "X:" kalıbı
function splitSections(text,defaultSec){
  const out={}; let cur=defaultSec||'history';
  const parts=splitSent(normalizeSpeech(text));
  parts.forEach(p=>{
    let body=p; const l=lc(p);
    let hit=null;
    const m=l.match(/^başlık\s+/); const off=m?m[0].length:0;
    for(const h of HEADER_LIST){
      if(l.startsWith(h.a,off)){
        const rest=l.slice(off+h.a.length);
        if(rest===''||/^[\s:,.\-–]/.test(rest)){ hit=h; body=p.slice(off+h.a.length).replace(/^[\s:,.\-–]+/,''); break; }
      }
    }
    if(hit) cur=hit.id;
    if(body){ (out[cur]=out[cur]||[]).push(body); }
  });
  Object.keys(out).forEach(k=>{ out[k]=out[k].map(capFirst).map(x=>/[.!?:]$/.test(x)?x:x+'.').join(' '); });
  return out;
}

function extractLabs(text,date){
  const s=lc(normalizeSpeech(text)); const found=[]; const used=[];
  LAB_ALIASES.forEach(({a,l})=>{
    const rx=new RegExp('(^|[^'+WORDCH+'])('+escRx(a)+')(?:\\s+(?:değeri|düzeyi|sayısı))?\\s*(?:[:=]\\s*)?(%\\s*)?(-?\\d+(?:[.,]\\d+)?)(\\s*bin\\b)?(?:\\s*(mg\\/dl|mg\\/l|g\\/dl|g\\/l|ng\\/ml|pg\\/ml|u\\/l|iu\\/l|mmol\\/l|\\/mm3|\\/mm³|mm\\/sa(?:at)?|indeks|%))?','g');
    let m; while((m=rx.exec(s))){
      const st=m.index+m[1].length, en=m.index+m[0].length;
      if(used.some(([a1,b1])=>st<b1&&en>a1)) continue;
      used.push([st,en]);
      let v=parseNum(m[4]); if(v==null) continue; if(m[5]) v=v*1000;
      let unit=m[6]? m[6].replace('mm3','mm³').replace(/^mg\/l$/,'mg/L').replace(/^mg\/dl$/,'mg/dL').replace(/^g\/dl$/,'g/dL').replace(/^ng\/ml$/,'ng/mL').replace(/^pg\/ml$/,'pg/mL').replace(/^u\/l$/,'U/L').replace(/^mmol\/l$/,'mmol/L') : l.u;
      if(m[3]&&!m[6]) unit='%';
      found.push({k:l.k,n:l.n,v,raw:fmtNum(v),u:unit,date:date||'',pos:st});
    }
  });
  found.sort((x,y)=>x.pos-y.pos);
  return {labs:found.map(({pos,...r})=>r), spans:used};
}
function extractVitals(text){
  const s=lc(normalizeSpeech(text)); const v={};
  let m;
  if((m=s.match(/(ateş(?:i)?|vücut ısısı|vücut sıcaklığı|aksiller ısı)\s*[:=]?\s*(\d{2}(?:[.,]\d)?)/))){ const t=parseNum(m[2]); if(t>=34&&t<=43) v.temp=fmtNum(t); }
  if((m=s.match(/(nabız|nabzı|kalp hızı|kalp tepe atımı)\s*[:=]?\s*(\d{2,3})/))) v.hr=m[2];
  if((m=s.match(/(solunum sayısı|solunum hızı|solunum)\s*[:=]?\s*(\d{1,3})(?!\s*gün)/))) v.rr=m[2];
  if((m=s.match(/(tansiyon|tansiyonu|kan basıncı|arteriyel basınç)\s*[:=]?\s*(\d{2,3})\s*[\/\-]\s*(\d{2,3})/))) v.bp=m[2]+'/'+m[3];
  if((m=s.match(/(satürasyon(?:u)?|saturasyon|spo2|oksijen satürasyonu)\s*[:=]?\s*%?\s*(\d{2,3})/))){ const x=+m[2]; if(x<=100) v.spo2=String(x); }
  return v;
}
function extractDemo(text){
  const s=lc(normalizeSpeech(text)); const d={}; let m;
  if((m=s.match(/(\d+(?:[.,]\d+)?)\s*(kg|kilogram)\b/))||(m=s.match(/(?:kilosu|ağırlığı|vücut ağırlığı)\s*[:=]?\s*(\d+(?:[.,]\d+)?)/))) d.weight=fmtNum(parseNum(m[1]));
  if((m=s.match(/(\d+)\s*(yaşında|yaşındaki|yaş)\b/))) d.age=m[1]+' yaş';
  else if((m=s.match(/(\d+)\s*(aylık|ay)\b(?!\s*(önce|sonra|süre))/))) d.age=m[1]+' ay';
  else if((m=s.match(/(\d+)\s*(günlük)\b/))) d.age=m[1]+' gün';
  if(/\b(kız|kız çocuğu|kadın)\b/.test(s)) d.sex='Kız'; else if(/\b(erkek)\b/.test(s)) d.sex='Erkek';
  return d;
}
const ORD_RX=/(\d)\.(\s*)(?=(gün|günde|günü|günden|gününde|hafta|haftada|ay|ayda|saat|doz|kür|kez|sıra|basamak|derece)\b)/gi;
function splitSent(t){ return t.replace(ORD_RX,'$1\u2024$2').split(/\n+|(?<=[.!?])\s+/).map(x=>x.replace(/\u2024/g,'.').trim()).filter(Boolean); }
function sentences(text){ return splitSent(normalizeSpeech(text)); }
function extractAbx(text){
  const out=[]; const seen=new Set();
  sentences(text).forEach(sent=>{
    const s=lc(sent);
    DRUG_ALIASES.forEach(({a,n})=>{
      const rx=wordRx(a,''); const m=rx.exec(s); if(!m||seen.has(n)) return;
      // aynı cümlede daha uzun bir takma ad (ör. seftazidim-avibaktam) zaten eşleştiyse atla
      if(out.some(o=>o._sent===sent&&o._span&&m.index+m[1].length>=o._span[0]&&m.index+m[1].length<o._span[1])) return;
      const st=m.index+m[1].length, after=s.slice(st,st+90), before=s.slice(Math.max(0,st-40),st);
      const r={drug:n,dose:'',freq:'',day:'',status:'',note:capFirst(sent),_sent:sent,_span:[st,st+a.length]};
      let x;
      if((x=after.match(/(\d+(?:[.,]\d+)?)\s*(mg|ünite|u|ıu)\s*\/\s*kg(\s*\/\s*(doz|gün))?/))) r.dose=x[1].replace('.',',')+' '+x[2].replace('u','U')+'/kg'+(x[4]?'/'+x[4]:'');
      if((x=after.match(/(\d+)\s*saatte\s*bir/))) r.freq=x[1]+' saatte bir'; else if((x=after.match(/günde\s*(\d+|bir|iki|üç|dört)\s*(kez|defa|doz)?/))) r.freq='günde '+x[1]+(x[2]?' '+x[2]:'');
      if((x=after.match(/(\d+)\s*\.?\s*(?:gün(?:ü|ünde)?)\b/))||(x=before.match(/(\d+)\s*gündür/))||(x=after.match(/(\d+)\s*gündür/))) r.day=x[1];
      if(/kesil|stop|bırakıl/.test(after.slice(0,60))) r.status='Kesildi'; else if(/başlan|eklen/.test(after.slice(0,60))) r.status='Başlandı'; else r.status='Devam';
      seen.add(n); out.push(r);
    });
  });
  return out.map(({_sent,_span,...r})=>r);
}
function extractMicro(text){
  const out=[];
  sentences(text).forEach(sent=>{
    const s=lc(sent);
    if(!/kültür|üredi|üreme|üremedi|izole edildi|pcr|hemokültür|antijen|serolo/.test(s)) return;
    let sample=''; for(const [n,a] of SAMPLES){ if(a.some(x=>s.includes(x))){ sample=n; break; } }
    const orgs=[]; ORG_ALIASES.forEach(({a,n})=>{ if(!orgs.includes(n)&&wordRx(a,'').test(s)&&!orgs.some(o=>o.startsWith(n.split(' ')[0])&&n.endsWith('spp.'))) orgs.push(n); });
    const neg=/üreme(si)? (olmadı|yok)|üremedi|steril|negatif/.test(s);
    const res=RES_TOKENS.filter(([,rx])=>rx.test(s)).map(([n])=>n);
    out.push({sample,org:orgs.join(', '),result:neg&&!orgs.length?'Üreme yok / negatif':(orgs.length?'Üreme var':''),res:res.join(', '),raw:capFirst(sent)});
  });
  return out;
}
function extractImaging(text){ return sentences(text).filter(x=>IMG_RX.test(lc(x))).map(capFirst); }
function extractRisks(text){ const s=lc(normalizeSpeech(text)); return RISK_TOKENS.filter(([,rx])=>rx.test(s)).map(([n])=>n); }

// Ana fonksiyon: dikteyi yapılandır
function parseDictation(text,opts){
  opts=opts||{};
  const norm=normalizeSpeech(text);
  const secs=splitSections(norm,opts.defaultSec);
  const res={sections:{},labs:[],vitals:{},demo:{},abx:[],micro:[],imaging:[],risks:[],summary:[]};
  // laboratuvar ve mikrobiyoloji/görüntüleme bölümü metinleri tabloya gider, yalnız artan metin not olur
  Object.entries(secs).forEach(([id,txt])=>{
    if(id==='labs'){

// Yaş hesabı
function ageFrom(birth,at){
  if(!birth) return '';
  const b=new Date(birth+'T12:00:00'), t=at?new Date(at+'T12:00:00'):new Date();
  if(isNaN(b)||isNaN(t)||t<b) return '';
  let m=(t.getFullYear()-b.getFullYear())*12+(t.getMonth()-b.getMonth()); if(t.getDate()<b.getDate()) m--;
  const days=Math.round((t-b)/86400000);
  if(days<31) return days+' günlük'; if(m<24) return m+' aylık'; return Math.floor(m/12)+' yaş'+(m%12?' '+(m%12)+' ay':'');
}

// Yerel arşiv: IndexedDB (tarayıcı) veya bellek (test). İsteğe bağlı AES-GCM şifreleme (PBKDF2-SHA256).
const B64={ enc:u8=>{ let s=''; const a=new Uint8Array(u8); for(let i=0;i<a.length;i++) s+=String.fromCharCode(a[i]); return btoa(s); }, dec:b=>Uint8Array.from(atob(b),c=>c.charCodeAt(0)) };
const KDF_ITER=310000;
function idbAdapter(name){
  let dbp=null;
  const open=()=>dbp||(dbp=new Promise((res,rej)=>{ const r=indexedDB.open(name,1); r.onupgradeneeded=()=>{ const db=r.result;
    if(!db.objectStoreNames.contains('patients')) db.createObjectStore('patients',{keyPath:'id'});
    if(!db.objectStoreNames.contains('consults')){ const s=db.createObjectStore('consults',{keyPath:'id'}); s.createIndex('patientId','patientId'); }
    if(!db.objectStoreNames.contains('meta')) db.createObjectStore('meta',{keyPath:'k'}); };
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }));
  const tx=(store,mode,fn)=>open().then(db=>new Promise((res,rej)=>{ const t=db.transaction(store,mode); const s=t.objectStore(store); const out=fn(s); t.oncomplete=()=>res((typeof IDBRequest!=='undefined'&&out instanceof IDBRequest)?out.result:out); t.onerror=()=>rej(t.error); t.onabort=()=>rej(t.error); }));
  return {
    get:(st,id)=>tx(st,'readonly',s=>s.get(id)),
    all:(st)=>tx(st,'readonly',s=>s.getAll()),
    put:(st,o)=>tx(st,'readwrite',s=>{ s.put(o); return null; }),
    del:(st,id)=>tx(st,'readwrite',s=>{ s.delete(id); return null; })
  };
}
function memAdapter(){ const m={patients:new Map(),consults:new Map(),meta:new Map()}; const key=(st,o)=>st==='meta'?o.k:o.id; const cl=o=>o==null?o:JSON.parse(JSON.stringify(o));
  return { get:async(st,id)=>cl(m[st].get(id)), all:async(st)=>[...m[st].values()].map(cl), put:async(st,o)=>{ m[st].set(key(st,o),cl(o)); }, del:async(st,id)=>{ m[st].delete(id); } }; }

function makeStore(adapter,cryptoImpl){
  const C=cryptoImpl||(typeof crypto!=='undefined'?crypto:null);
  let key=null, cryptoMeta=null;
  const enc=new TextEncoder(), dec=new TextDecoder();
  async function deriveKey(pass,salt,iter){ const base=await C.subtle.importKey('raw',enc.encode(pass),'PBKDF2',false,['deriveKey']); return C.subtle.deriveKey({name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']); }
  async function encObj(o,k){ const iv=C.getRandomValues(new Uint8Array(12)); const ct=await C.subtle.encrypt({name:'AES-GCM',iv},k||key,enc.encode(JSON.stringify(o))); return {iv:B64.enc(iv),data:B64.enc(new Uint8Array(ct))}; }
  async function decObj(e,k){ const pt=await C.subtle.decrypt({name:'AES-GCM',iv:B64.dec(e.iv)},k||key,B64.dec(e.data)); return JSON.parse(dec.decode(pt)); }
  const wrap=async(o,isConsult)=>{ if(!cryptoMeta) return o; const w={id:o.id,updatedAt:o.updatedAt,enc:await encObj(o)}; if(isConsult) w.patientId=o.patientId; return w; };
  const unwrap=async(w)=>{ if(!w) return w; if(!w.enc) return w; if(!key) throw new Error('locked'); return decObj(w.enc); };
  const api={
    async init(){ const m=await adapter.get('meta','crypto'); cryptoMeta=m||null; return api.status(); },
    status(){ return {encrypted:!!cryptoMeta, locked:!!cryptoMeta&&!key}; },
    async unlock(pass){ if(!cryptoMeta) return true; const k=await deriveKey(pass,B64.dec(cryptoMeta.salt),cryptoMeta.iter); try{ const v=await decObj(cryptoMeta.check,k); if(v!=='aseah-ok') return false; key=k; return true; }catch(e){ return false; } },
    lock(){ if(cryptoMeta) key=null; },
    async setPassphrase(pass){ // şifrele veya parolayı değiştir
      if(cryptoMeta&&!key) throw new Error('locked');
      const ps=await adapter.all('patients'), cs=await adapter.all('consults');
      const plainP=await Promise.all(ps.map(unwrap)), plainC=await Promise.all(cs.map(unwrap));
      const salt=C.getRandomValues(new Uint8Array(16)); const k=await deriveKey(pass,salt,KDF_ITER);
      const meta={k:'crypto',salt:B64.enc(salt),iter:KDF_ITER,check:await encObj('aseah-ok',k),since:new Date().toISOString()};
      key=k; cryptoMeta=meta;
      for(const p of plainP) await adapter.put('patients',await wrap(p,false));
      for(const c of plainC) await adapter.put('consults',await wrap(c,true));
      await adapter.put('meta',meta); return true;
    },
    async removePassphrase(){ if(!cryptoMeta) return; if(!key) throw new Error('locked');
      const ps=await Promise.all((await adapter.all('patients')).map(unwrap)), cs=await Promise.all((await adapter.all('consults')).map(unwrap));
      cryptoMeta=null; key=null; for(const p of ps) await adapter.put('patients',p); for(const c of cs) await adapter.put('consults',c); await adapter.del('meta','crypto'); },
    async patients(){ return Promise.all((await adapter.all('patients')).map(unwrap)); },
    async consults(){ return Promise.all((await adapter.all('consults')).map(unwrap)); },
    async consultsOf(pid){ return (await api.consults()).filter(c=>c.patientId===pid); },
    async savePatient(p){ p.updatedAt=new Date().toISOString(); await adapter.put('patients',await wrap(p,false)); return p; },
    async saveConsult(c){ c.updatedAt=new Date().toISOString(); await adapter.put('consults',await wrap(c,true)); return c; },
    async getMeta(k){ const m=await adapter.get('meta',k); return m?m.v:undefined; },
    async setMeta(k,v){ await adapter.put('meta',{k,v}); },
    // Yedek: kayıtlar depolandığı haliyle (şifreliyse şifreli) dışa aktarılır
    async exportAll(){ return {app:'aseah-konsultasyon',format:1,exportedAt:new Date().toISOString(),crypto:cryptoMeta,patients:await adapter.all('patients'),consults:await adapter.all('consults')}; },
    async importAll(b){
      if(!b||b.app!=='aseah-konsultasyon') throw new Error('Geçerli bir konsültasyon arşivi yedeği değil.');
      const localP=await adapter.all('patients'), localC=await adapter.all('consults');
      const empty=!localP.length&&!localC.length;
      if(b.crypto&&(!cryptoMeta||cryptoMeta.salt!==b.crypto.salt)){
        if(empty&&!cryptoMeta){ cryptoMeta=b.crypto; key=null; await adapter.put('meta',b.crypto); }
        else throw new Error('Yedek farklı bir parolayla şifrelenmiş. Önce bu cihazdaki arşivi yedekleyin; yedeği boş bir arşive yükleyin veya aynı parolayı kullanın.');
      }
      if(empty&&b.crypto){ for(const r of b.patients||[]) await adapter.put('patients',r); for(const r of b.consults||[]) await adapter.put('consults',r); return {added:(b.patients||[]).length+(b.consults||[]).length,updated:0,kept:0,needUnlock:!key}; }
      if(cryptoMeta&&!key) throw new Error('locked');
      const inc=async r=>r&&r.enc? decObj(r.enc) : r;
      let added=0, updated=0, kept=0;
      const merge=async(st,list,local)=>{ const L=new Map(); for(const x of local) L.set(x.id,await unwrap(x));
        for(const r0 of list){ const nw=await inc(r0); const ex=L.get(nw.id);
          if(!ex){ await adapter.put(st,await wrap(nw,st==='consults')); added++; }
          else if((nw.updatedAt||'')>(ex.updatedAt||'')){
            if(st==='consults'){ nw.history=(nw.history||[]).concat((ex.history||[]).filter(h=>!(nw.history||[]).some(x=>x.at===h.at))); if(!nw.history.some(h=>h.at===ex.updatedAt)) nw.history.push({at:ex.updatedAt,data:Object.assign({},ex,{history:undefined}),note:'Yedek birleştirme öncesi sürüm'}); }
            await adapter.put(st,await wrap(nw,st==='consults')); updated++; }
          else kept++; } };
      await merge('patients',b.patients||[],localP); await merge('consults',b.consults||[],localC);
      return {added,updated,kept,needUnlock:!!cryptoMeta&&!key};
    }
  };
  return api;
}
function uid(){ return (typeof crypto!=='undefined'&&crypto.randomUUID)? crypto.randomUUID() : 'id-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,10); }

const fmtD=s=>{ if(!s) return ''; const p=s.split('-'); return p.length===3? p[2]+'.'+p[1]+'.'+p[0] : s; };

let pmCache='';

async function boot(){
  S=makeStore(idbAdapter('aseah-konsultasyon'));
  const st=await S.init();
  if(st.locked){ showLock(); return; }
  await afterUnlock();
}
async function afterUnlock(){
  $('lock').classList.remove('show');
  settings=(await S.getMeta('settings'))||{};
  await reload();
  renderAll();
  startIdleLock();
}
async function reload(){ patients=(await S.patients()).filter(p=>!p.deleted); allConsults=await S.consults(); }
function showLock(){ $('lock').classList.add('show'); $('lockErr').textContent=''; setTimeout(()=>$('lockPass').focus(),50); }
$('bUnlock').onclick=async()=>{ const ok=await S.unlock($('lockPass').value); if(!ok){ $('lockErr').textContent='Parola yanlış.'; return; } $('lockPass').value=''; await afterUnlock(); };
$('lockPass').addEventListener('keydown',e=>{ if(e.key==='Enter') $('bUnlock').click(); });
let idleT=null;
function startIdleLock(){ const reset=()=>{ clearTimeout(idleT); if(S.status().encrypted) idleT=setTimeout(async()=>{ await flushSave(); S.lock(); cur=null; curP=null; showLock(); },15*60*1000); }; ['click','keydown','pointermove'].forEach(e=>document.addEventListener(e,reset,{passive:true})); reset(); }

function saveSettings(){ return S.setMeta('settings',settings); }
function lastActivity(p){ const cs=allConsults.filter(c=>c.patientId===p.id&&!c.deleted); return cs.reduce((m,c)=>c.updatedAt>m?c.updatedAt:m,p.updatedAt||''); }

function renderAll(){ renderTop(); renderBanners(); renderList(); renderMain(); }
function renderTop(){
  const st=S.status();
  $('lockPill').className='pill '+(st.encrypted?'g':'m'); $('lockPill').textContent=st.encrypted?'Arşiv şifreli':'Arşiv şifresiz (yerel)';
  $('verLine').textContent='Sürüm '+APP_VERSION+' · kütüphane '+RULES_DATE+' · kayıtlar yalnız bu cihazda';
}
function renderBanners(){
  const b=[]; const n=allConsults.filter(c=>!c.deleted).length;
  const lb=settings.lastBackup? new Date(settings.lastBackup):null;
  if(n&&(!lb||(Date.now()-lb)>7*864e5)) b.push('<div class="banner">⚠ '+(lb?'Son yedek '+fmtDT(settings.lastBackup)+'.':'Henüz yedek alınmadı.')+' Kayıtlar yalnız bu tarayıcıda; tarayıcı verisi silinirse kaybolur. <button class="small" type="button" data-act="backup">Şimdi yedek al</button></div>');
  if(!S.status().encrypted&&n) b.push('<div class="banner">🔒 Arşiv şifresiz. Ortak kullanılan bilgisayarda Ayarlar → "Arşivi parolayla şifrele" önerilir.</div>');
  $('banners').innerHTML=b.join('');
}
function renderList(){
  const q=($('q').value||'').toLocaleLowerCase('tr-TR');
  const list=patients.filter(p=>!q||(p.name||'').toLocaleLowerCase('tr-TR').includes(q)||String(p.protocol||'').includes(q)).sort((a,b)=>lastActivity(b).localeCompare(lastActivity(a)));
  $('plist').innerHTML=list.length? list.map(p=>{ const cs=allConsults.filter(c=>c.patientId===p.id&&!c.deleted); const dr=cs.some(c=>c.status!=='final');
    return '<li data-pid="'+p.id+'" class="'+(curP&&curP.id===p.id?'on':'')+'"><div class="n">'+esc(p.name||'(adsız)')+'</div><div class="m">Prot. '+esc(p.protocol||'—')+' · '+cs.length+' konsültasyon'+(cs.length?' · son '+fmtD((cs.map(c=>c.date).sort().pop())||''):'')+(dr?' · <span class="pill">taslak</span>':'')+'</div></li>'; }).join('') : '<li style="cursor:default;color:var(--muted)">'+(q?'Eşleşen hasta yok.':'Arşivde hasta yok. "Yeni hasta" ile başlayın.')+'</li>';
}
$('q').addEventListener('input',renderList);
$('plist').addEventListener('click',async e=>{ const li=e.target.closest('li[data-pid]'); if(!li) return; await flushSave(); curP=patients.find(p=>p.id===li.dataset.pid); const cs=consultsOfCur(); cur=cs.find(c=>c.status!=='final')||null; renderList(); renderMain(); });
function consultsOfCur(){ return curP? allConsults.filter(c=>c.patientId===curP.id&&!c.deleted).sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time)) : []; }

function trendData(){

function bindEditor(){
  const m=$('main');
  m.oninput=e=>{
    const t=e.target;
    if(t.dataset.p){ curP[t.dataset.p]=t.value; schedule(true); return; }
    if(!cur) return;
    if(t.id==='dictBox'){ cur.dictation=t.value; schedule(); return; }
    if(t.id==='pmq'){ cur.pmq=t.value; return; }
    if(t.dataset.ad&&cur.adDraft){ cur.adDraft[t.dataset.ad]=t.value; schedule(); return; }
    if(cur.status==='final') return;
    if(t.dataset.dx!=null){ const it=cur.ddx[+t.dataset.dx]; if(it){ it.t=t.value; it.ed=true; } schedule(); return; }
    if(t.dataset.pi!=null){ const it=cur.planItems[+t.dataset.pi]; if(it){ it.t=t.value; it.ed=true; } schedule(); return; }
    if(t.dataset.f){ cur[t.dataset.f]=t.value; if(t.dataset.f==='consultant') settings.consultant=t.value; if(t.dataset.f==='ctitle') settings.ctitle=t.value; schedule(); }
    else if(t.dataset.s){ (cur.sections=cur.sections||{})[t.dataset.s]=t.value; schedule(); }
    else if(t.dataset.v){ (cur.vitals=cur.vitals||{})[t.dataset.v]=t.value; schedule(); }
    else if(t.dataset.t){ cur[t.dataset.t][+t.dataset.i][t.dataset.k]=t.value; schedule(); }
    else if(t.dataset.img){ cur.imaging=t.value.split('\n').map(x=>x.trim()).filter(Boolean); schedule(); }
  };
  m.onchange=e=>{
    const t=e.target;
    if(t.dataset.p==='sex'||t.dataset.p==='birth'){ curP[t.dataset.p]=t.value; schedule(true); renderMain(); return; }
    if(!cur) return;
    if(t.dataset.ad==='type'&&cur.adDraft){ cur.adDraft.type=t.value; schedule(); return; }
    if(cur.status!=='final'){
      if(t.dataset.opt){ toggleOpt(t.dataset.opt,t.checked); return; }
      if(t.dataset.topic){ const k=t.dataset.topic; cur.topicsOff=(cur.topicsOff||[]).filter(x=>x!==k); cur.topics=cur.topics||[]; if(!t.checked){ if(cur.topics.includes(k)) cur.topics=cur.topics.filter(x=>x!==k); else cur.topicsOff.push(k); } schedule(); rerenderKeep(); return; }
      if(t.id==='addTopic'&&t.value){ const k=t.value; cur.topics=cur.topics||[]; if(!cur.topics.includes(k)) cur.topics.push(k); cur.topicsOff=(cur.topicsOff||[]).filter(x=>x!==k); openT[k]=true; schedule(); rerenderKeep(); return; }
      if(t.dataset.f==='weight'){ syncItems(); document.querySelectorAll('textarea[data-pi]').forEach(el=>{ const it=cur.planItems[+el.dataset.pi]; if(it&&it.oid&&!it.ed) el.value=it.t; }); const oc=$('optCard'); if(oc){ oc.outerHTML=optHTML(); } schedule(); }
    }
    if(t.dataset.f==='urgency'){ cur.urgency=t.value; schedule(); }
    if(t.dataset.o){ (cur.opts=cur.opts||{})[t.dataset.o]=t.checked; schedule(); }
    if(t.dataset.lib){ const l=LIB.find(x=>x.id===t.dataset.lib); cur.refs=cur.refs||[]; if(t.checked){ if(!cur.refs.some(r=>r.u===l.u)) cur.refs.push({t:l.t.replace(/\*$/,''),u:l.u,src:'lib'}); } else cur.refs=cur.refs.filter(r=>r.u!==l.u); schedule(); refreshLit(); }
    if(t.dataset.s) refreshLit();
  };
  m.onclick=async e=>{
    const b=e.target.closest('button'); if(!b) return;
    if(b.dataset.open){ await flushSave(); cur=allConsults.find(c=>c.id===b.dataset.open); undoSnap=null; lastParse=null; pmCache=''; renderMain(); window.scrollTo({top:0}); return; }
    if(b.dataset.add){ cur[b.dataset.add]=cur[b.dataset.add]||[]; cur[b.dataset.add].push({}); schedule(); rerenderKeep(); return; }
    if(b.dataset.del){ cur[b.dataset.del].splice(+b.dataset.i,1); schedule(); rerenderKeep(); return; }
    if(b.dataset.mic){ toggleMic(b.dataset.mic); return; }
    if(b.dataset.dxdel!=null){ cur.ddx.splice(+b.dataset.dxdel,1); schedule(); rerenderKeep(); return; }
    if(b.dataset.pidel!=null){ cur.planItems.splice(+b.dataset.pidel,1); schedule(); rerenderKeep(); return; }
    if(b.dataset.dxadd){ cur.ddx=cur.ddx||[]; const it={id:uid(),t:'',src:'manual'}; cur.ddx.push(it); schedule(); rerenderKeep(); const el=$('dx-'+it.id); if(el) el.focus(); return; }
    if(b.dataset.piadd){ cur.planItems=cur.planItems||[]; const it={id:uid(),cat:b.dataset.piadd,t:'',src:'manual'}; cur.planItems.push(it); schedule(); rerenderKeep(); const el=$('pi-'+it.id); if(el) el.focus(); return; }
    if(b.dataset.adword){ doAdDocx(b.dataset.adword); return; }
    if(b.dataset.adpdf){ doAdPrint(b.dataset.adpdf); return; }
    if(b.dataset.adedit){ adEdit(b.dataset.adedit); return; }
    if(b.dataset.addel){ adDel(b.dataset.addel); return; }
    if(b.dataset.rdel!=null){ cur.refs.splice(+b.dataset.rdel,1); schedule(); refreshLit(); return; }
    if(b.dataset.site){ const s=SEARCH_SITES.find(x=>x.id===b.dataset.site); const q=($('pmq')&&$('pmq').value)||''; window.open(s.f(q),'_blank','noopener'); return; }
    if(b.dataset.addpm){ const r=JSON.parse(decodeURIComponent(b.dataset.addpm)); cur.refs=cur.refs||[]; if(!cur.refs.some(x=>x.u===r.u)) cur.refs.push(r); schedule(); b.disabled=true; b.textContent='Eklendi'; pmCache=$('pmRes')?$('pmRes').innerHTML:pmCache; refreshLit(); return; }
    const a=b.dataset.act; if(!a) return;
    const acts={newConsult,delPatient,parse:doParse,undo:doUndo,clearDict,carry:doCarry,finalize:doFinalize,newVersion:doNewVersion,docx:doDocx,print:doPrint,toClaude:doToClaude,fromClaude:doFromClaude,pubmed:doPubmed,addRef:doAddRef,delConsult,backup:doBackup,adNew,adCancel,adSave};
    if(acts[a]) acts[a]();
  };
  if(rec&&recOn) setMicUI(true);

}

function schedule(patientToo){ clearTimeout(saveT); if(patientToo) curP._dirty=true; saveT=setTimeout(flushSave,700); }
async function flushSave(){
  clearTimeout(saveT); saveT=null;
  try{
    if(curP&&curP._dirty){ delete curP._dirty; await S.savePatient(curP); }
    if(cur){ await S.saveConsult(cur); const i=allConsults.findIndex(x=>x.id===cur.id); if(i<0) allConsults.push(cur); else allConsults[i]=cur; const si=$('savedInfo'); if(si) si.textContent='Kaydedildi '+fmtDT(cur.updatedAt); }
    if(settings.consultant!==undefined) await saveSettings();
    if(!settings.persistAsked&&navigator.storage&&navigator.storage.persist){ settings.persistAsked=true; settings.persisted=await navigator.storage.persist(); await saveSettings(); }
  }catch(err){ if(String(err.message)==='locked') showLock(); else alert('Kaydedilemedi: '+err.message); }
  renderList();
}

async function doPubmed(){

async function pmSummary(ids){

  if((c.imaging||[]).length){ B.push({h1:'Görüntüleme'}); B.push({bullets:c.imaging.map(x=>'• '+x)}); }
  const abx=(c.abx||[]).filter(a=>a.drug);
  if(abx.length||s.abx){ B.push({h1:'Antimikrobiyal tedavi'}); if(abx.length) B.push({table:{head:['İlaç','Doz','Sıklık','Gün','Başlangıç','Durum'],rows:abx.map(a=>[a.drug||'',a.dose||'',a.freq||'',a.day||'',a.start||'',a.status||'']),widths:[0.24,0.16,0.18,0.08,0.16,0.18]}}); if(s.abx) B.push({p:s.abx}); }
  syncItems(c);
  if(s.assess&&s.assess.trim()){ B.push({h1:'Değerlendirme'}); B.push({p:s.assess.trim()}); }
  const ddx=(c.ddx||[]).filter(x=>x.t&&x.t.trim());
  if(ddx.length){ B.push({h1:'Ayırıcı tanı'}); B.push({bullets:ddx.map(x=>'• '+x.t.trim())}); }
  const pis=(c.planItems||[]).filter(x=>x.t&&x.t.trim());
  if(pis.length||(s.plan&&s.plan.trim())){ B.push({h1:SEC_BY_ID.plan.t});
    PLAN_CATS.forEach(cat=>{ const its=pis.filter(x=>(x.cat||'İzlem')===cat); if(its.length){ B.push({h2:cat}); B.push({bullets:its.map(x=>'• '+x.t.trim())}); } });
    if(s.plan&&s.plan.trim()){ if(pis.length) B.push({h2:'Ek öneriler'}); const lines=s.plan.split('\n').map(x=>x.trim()).filter(Boolean); if(lines.every(x=>/^[•\-*\d]/.test(x))) B.push({bullets:lines.map(x=>'• '+x.replace(/^[•\-*]\s*/,''))}); else B.push({p:s.plan.trim()}); } }
  const ads=(c.addenda||[]).filter(a=>!a.deleted).sort((a,b)=>((a.date||'')+(a.time||'')).localeCompare((b.date||'')+(b.time||'')));
  if(ads.length&&(!c.opts||c.opts.addenda!==false)){ B.push({h1:'Ek notlar / Rekonsültasyon'}); ads.forEach(a=>addBlocks(B,a,true)); }
  if(c.opts&&c.opts.prev){ const pr=prevConsults(); if(pr.length){ B.push({h1:'Önceki konsültasyonlar'}); B.push({bullets:pr.slice(0,5).map(x=>'• '+fmtD(x.date)+': '+planSummary(x).replace(/\s+/g,' ').slice(0,400))}); } }
  if((c.refs||[]).length){ B.push({h1:'Kaynaklar'}); B.push({refs:c.refs.map(r=>({t:r.t,u:r.u}))}); }
  B.push({p:[{t:'Konsültan: ',b:true},{t:[c.consultant,c.ctitle].filter(Boolean).join(', ')||'………………'}]});
  B.push({p:[{t:'Not tarihi: ',b:true},{t:fmtD(c.date)+' '+(c.time||'')+(c.status==='final'?' · tamamlandı '+fmtDT(c.finalizedAt):' · TASLAK')+(c.version>1?' · sürüm '+c.version:'')}]});
  B.push({p:'Bu not klinik karar desteği amacıyla hazırlanmıştır; tanı ve tedavi kararı hastayı izleyen hekimin değerlendirmesiyle verilir. İlaç dozlarını yaş, ağırlık ve böbrek/karaciğer fonksiyonuna göre doğrulayın. Kaynak bağlantıları not hazırlanırken eklenmiştir.',style:'Note'});
  return {docTitle:'Konsültasyon notu – '+fmtD(c.date),author:c.consultant||'',header:'T.C. SAĞLIK BAKANLIĞI • ADANA ŞEHİR EĞİTİM VE ARAŞTIRMA HASTANESİ',header2:'ÇOCUK ENFEKSİYON HASTALIKLARI KLİNİĞİ – KONSÜLTASYON NOTU',footer:maskName(p.name)+' • Prot. '+maskNo(p.protocol)+' • klinik dışına paylaşılmamalıdır',blocks:B};
}
function addBlocks(B,a,inMain){
  B.push(inMain?{h2:fmtD(a.date)+' '+(a.time||'')+' – '+a.type+(a.author?' ('+a.author+')':'')}:{h1:a.type});
  if(a.text) B.push({p:a.text});
  if((a.labs||[]).length) B.push({table:{head:['Parametre','Sonuç','Birim','Tarih'],rows:a.labs.map(l=>[l.n||'',l.raw||'',l.u||'',l.date||'']),widths:[0.4,0.2,0.2,0.2]}});
  if((a.micro||[]).length) B.push({table:{head:['Örnek','Etken / sonuç','Direnç','Açıklama'],rows:a.micro.map(m=>[m.sample||'',m.org||'',m.res||'',m.raw||'']),widths:[0.16,0.28,0.18,0.38]}});
  if(a.plan){ if(inMain) B.push({p:[{t:'Öneri: ',b:true},{t:a.plan}]}); else { B.push({h1:'Öneriler'}); B.push({p:a.plan}); } }
}
function buildAddModel(a){
  const c=cur, p=curP, mask=c.opts&&c.opts.mask; const B=[]; const age=ageFrom(p.birth,a.date);
  B.push({title:'KONSÜLTASYON EK NOTU – '+String(a.type||'').toLocaleUpperCase('tr-TR')});
  B.push({kv:[['Hasta',mask?maskName(p.name):p.name],['Protokol no',mask?maskNo(p.protocol):p.protocol],['Yaş',age||''],['Ağırlık',c.weight?c.weight+' kg':''],['Servis / bölüm',c.ward||''],['Ana konsültasyon',fmtD(c.date)+' '+(c.time||'')+(c.requester?' – '+c.requester:'')],['Ek not tarihi',fmtD(a.date)+' '+(a.time||'')]].filter(r=>r[1]!=='')});
  const s=c.sections||{}; const brief=[s.assess,(c.ddx||[]).filter(x=>x.t).length?'Ayırıcı tanı: '+c.ddx.filter(x=>x.t).map(x=>x.t).join('; '):''].filter(Boolean).join('\n');
  if(brief){ B.push({h1:'Ana konsültasyondaki değerlendirme (özet)'}); B.push({p:brief.length>900?brief.slice(0,900)+'…':brief}); }
  addBlocks(B,a,false);
  if((c.refs||[]).length){ B.push({h1:'Kaynaklar'}); B.push({refs:c.refs.map(r=>({t:r.t,u:r.u}))}); }
  B.push({p:[{t:'Yazan: ',b:true},{t:a.author||[c.consultant,c.ctitle].filter(Boolean).join(', ')||'………………'}]});
  B.push({p:'Bu ek not, belirtilen tarihli konsültasyonun devamıdır; klinik karar desteği amacıyla hazırlanmıştır. İlaç dozlarını yaş, ağırlık ve böbrek/karaciğer fonksiyonuna göre doğrulayın.',style:'Note'});
  return {docTitle:'Konsültasyon ek notu – '+fmtD(a.date),author:a.author||c.consultant||'',header:'T.C. SAĞLIK BAKANLIĞI • ADANA ŞEHİR EĞİTİM VE ARAŞTIRMA HASTANESİ',header2:'ÇOCUK ENFEKSİYON HASTALIKLARI KLİNİĞİ – KONSÜLTASYON EK NOTU',footer:maskName(p.name)+' • Prot. '+maskNo(p.protocol)+' • klinik dışına paylaşılmamalıdır',blocks:B};
}
async function doAdDocx(id){ const a=(cur.addenda||[]).find(x=>x.id===id); if(!a) return; await flushSave(); download(fileStem()+'_ek_'+a.date+'_'+String(a.time||'').replace(':','')+'.docx',buildDocx(buildAddModel(a)),'application/vnd.openxmlformats-officedocument.wordprocessingml.document'); }
async function doAdPrint(id){ const a=(cur.addenda||[]).find(x=>x.id===id); if(!a) return; await flushSave(); $('printArea').innerHTML=modelHTML(buildAddModel(a)); const t=document.title; document.title=fileStem()+'_ek_'+a.date; window.print(); setTimeout(()=>{ document.title=t; },500); }
function modelHTML(m){
  const run=r=>{ if(typeof r==='string') r={t:r}; let t=esc(r.t); if(r.link) t='<a href="'+esc(r.link)+'">'+t+'</a>'; if(r.b) t='<b>'+t+'</b>'; if(r.i) t='<i>'+t+'</i>'; return t; };
  let h='<div class="pb1">'+esc(m.header)+'</div><div class="pb2">'+esc(m.header2)+'</div>';
  m.blocks.forEach(b=>{
    if(b.title) h+='<div class="pt">'+esc(b.title)+'</div>';
    else if(b.h1) h+='<h2>'+esc(b.h1)+'</h2>'; else if(b.h2) h+='<h3 style="color:#9A3412;font-size:10.5pt;margin:8px 0 3px">'+esc(b.h2)+'</h3>';
    else if(b.p!=null) h+='<p'+(b.style==='Note'?' class="note"':'')+'>'+(typeof b.p==='string'?esc(b.p):b.p.map(run).join(''))+'</p>';
    else if(b.bullets) h+='<ul>'+b.bullets.map(x=>'<li>'+esc(String(x).replace(/^•\s*/,''))+'</li>').join('')+'</ul>';
    else if(b.kv) h+='<table>'+b.kv.map(([k,v])=>'<tr><td class="k">'+esc(k)+'</td><td>'+esc(v)+'</td></tr>').join('')+'</table>';
    else if(b.table) h+='<table>'+(b.table.head?'<tr>'+b.table.head.map(x=>'<th>'+esc(x)+'</th>').join('')+'</tr>':'')+b.table.rows.map(r=>'<tr>'+r.map(x=>'<td>'+esc(x)+'</td>').join('')+'</tr>').join('')+'</table>';
    else if(b.refs) h+='<ol>'+b.refs.map(r=>'<li>'+esc(r.t)+' <a href="'+esc(r.u)+'">'+esc(r.u)+'</a></li>').join('')+'</ol>';
  });
  return h+'<div class="ft">'+esc(m.footer)+'</div>';
}
function fileStem(){ const n=(cur.opts&&cur.opts.mask?maskName(curP.name):curP.name||'hasta').replace(/[^\wığüşöçİĞÜŞÖÇ.-]+/g,'_'); return 'konsultasyon_'+n+'_'+cur.date; }
async function doDocx(){ await flushSave(); const bytes=buildDocx(buildModel()); download(fileStem()+'.docx',bytes,'application/vnd.openxmlformats-officedocument.wordprocessingml.document'); }
async function doPrint(){ await flushSave(); $('printArea').innerHTML=modelHTML(buildModel()); const t=document.title; document.title=fileStem(); window.print(); setTimeout(()=>{ document.title=t; },500); }
function download(name,data,type){ const blob=data instanceof Blob?data:new Blob([data],{type}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },800); }

// ---------- Yedek, ayarlar ----------
async function doBackup(){ await flushSave(); const b=await S.exportAll(); const d=new Date(); const stamp=d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')+'-'+String(d.getHours()).padStart(2,'0')+String(d.getMinutes()).padStart(2,'0');
  download('aseah-konsultasyon-yedek-'+stamp+'.json',JSON.stringify(b),'application/json'); settings.lastBackup=d.toISOString(); await saveSettings(); renderBanners(); }
$('bBackup').onclick=doBackup;
$('bSettings').onclick=async()=>{
  const st=S.status(); const delP=(await S.patients()).filter(p=>p.deleted); const delC=allConsults.filter(c=>c.deleted);
  let pers='bilinmiyor'; try{ if(navigator.storage&&navigator.storage.persisted) pers=(await navigator.storage.persisted())?'kalıcı (tarayıcı kendiliğinden silmez)':'kalıcı değil – düzenli yedek alın'; }catch(e){}
  dialog('Ayarlar ve arşiv',
   '<div class="grid2"><div><label for="st-c">Konsültan adı (varsayılan)</label><input id="st-c" value="'+esc(settings.consultant||'')+'"></div><div><label for="st-t">Unvan</label><input id="st-t" value="'+esc(settings.ctitle||'')+'" placeholder="ör. Çocuk Enfeksiyon Hastalıkları Uzmanı"></div></div>'+
   '<h3 style="margin:14px 0 4px;color:var(--head)">Şifreleme</h3><p class="hint">'+(st.encrypted?'Arşiv AES-256 ile şifreli. 15 dakika işlem yapılmazsa kilitlenir. Parolayı unutursanız kayıtlar açılamaz; parolayı güvenli bir yerde saklayın.':'Arşiv şifresiz. Parola belirlerseniz tüm kayıtlar ve yedekler şifrelenir.')+'</p>'+
   '<div class="grid2"><div><label for="st-p1">'+(st.encrypted?'Yeni parola':'Parola')+' (en az 8 karakter)</label><input id="st-p1" type="password" autocomplete="new-password"></div><div><label for="st-p2">Parola tekrar</label><input id="st-p2" type="password" autocomplete="new-password"></div></div>'+
   '<div class="btns"><button type="button" class="small" id="st-enc">'+(st.encrypted?'Parolayı değiştir':'Arşivi parolayla şifrele')+'</button>'+(st.encrypted?'<button type="button" class="small ghost" id="st-lock">Şimdi kilitle</button><button type="button" class="small ghost" id="st-dec">Şifrelemeyi kaldır</button>':'')+'</div>'+
   '<h3 style="margin:14px 0 4px;color:var(--head)">Yedek ve geri yükleme</h3><p class="hint">Son yedek: '+(settings.lastBackup?fmtDT(settings.lastBackup):'yok')+' · Depolama: '+pers+'. Yedek dosyası, arşiv şifreliyse şifreli iner. Geri yüklemede kayıtlar birleştirilir; aynı kaydın eski sürümü sürüm geçmişinde saklanır, hiçbir kayıt silinmez.</p>'+
   '<div class="btns"><button type="button" class="small" id="st-bk">Yedek indir</button><button type="button" class="small ghost" id="st-rs">Yedekten geri yükle</button><input type="file" id="st-file" accept=".json,application/json" hidden></div>'+
   '<h3 style="margin:14px 0 4px;color:var(--head)">Kaldırılanlar</h3>'+((delP.length||delC.length)?'<ul class="tl">'+delP.map(p=>'<li><span class="s">Hasta: '+esc(p.name)+' (prot. '+esc(p.protocol||'—')+')</span><button class="small ghost" type="button" data-rp="'+p.id+'">Geri al</button></li>').join('')+delC.map(c=>{ const p=patients.find(x=>x.id===c.patientId)||delP.find(x=>x.id===c.patientId)||{}; return '<li><span class="s">Konsültasyon: '+esc(p.name||'?')+' – '+fmtD(c.date)+'</span><button class="small ghost" type="button" data-rc="'+c.id+'">Geri al</button></li>'; }).join('')+'</ul>':'<p class="hint">Kaldırılan kayıt yok.</p>'),
   [['Kapat',async()=>{ settings.consultant=$('st-c').value; settings.ctitle=$('st-t').value; await saveSettings(); return true; },true]]);
  $('st-enc').onclick=async()=>{ const a=$('st-p1').value,b2=$('st-p2').value; if(a.length<8){ alert('Parola en az 8 karakter olmalı.'); return; } if(a!==b2){ alert('Parolalar eşleşmiyor.'); return; } if(!confirm('Parolayı unutursanız kayıtlar kurtarılamaz. Devam edilsin mi?')) return; await flushSave(); await S.setPassphrase(a); alert('Arşiv şifrelendi. Yeni bir yedek alınması önerilir (eski yedekler şifresizdir).'); $('dlg').close(); renderAll(); };
  if($('st-lock')) $('st-lock').onclick=async()=>{ await flushSave(); S.lock(); cur=null; curP=null; $('dlg').close(); showLock(); };
  if($('st-dec')) $('st-dec').onclick=async()=>{ if(!confirm('Şifreleme kaldırılsın mı? Kayıtlar bu cihazda şifresiz saklanacak.')) return; await S.removePassphrase(); $('dlg').close(); renderAll(); };
  $('st-bk').onclick=doBackup; $('st-rs').onclick=()=>$('st-file').click();
  $('st-file').onchange=e=>{ const f=e.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=async()=>{ try{ const res=await S.importAll(JSON.parse(r.result)); $('dlg').close(); if(res.needUnlock){ alert('Yedek yüklendi ('+res.added+' kayıt). Arşiv şifreli; yedeğin parolasıyla kilidi açın.'); showLock(); return; } await reload(); renderAll(); alert('Geri yükleme tamam: '+res.added+' yeni, '+res.updated+' güncellenen, '+res.kept+' değişmeyen kayıt.'); }catch(err){ alert(err.message==='locked'?'Önce arşivin kilidini açın.':err.message); } }; r.readAsText(f); e.target.value=''; };
  $('dlgB').querySelectorAll('[data-rp]').forEach(b=>b.onclick=async()=>{ const p=(await S.patients()).find(x=>x.id===b.dataset.rp); p.deleted=false; await S.savePatient(p); await reload(); $('dlg').close(); renderAll(); });
  $('dlgB').querySelectorAll('[data-rc]').forEach(b=>b.onclick=async()=>{ const c=allConsults.find(x=>x.id===b.dataset.rc); c.deleted=false; await S.saveConsult(c); const p=(await S.patients()).find(x=>x.id===c.patientId); if(p&&p.deleted){ p.deleted=false; await S.savePatient(p); } await reload(); $('dlg').close(); renderAll(); });
};

// ---------- Genel iletişim kutusu ----------
function dialog(title,body,buttons){
  const d=$('dlg'); $('dlgT').textContent=title; $('dlgB').innerHTML=body; const f=$('dlgF'); f.innerHTML='';
  (buttons||[]).forEach(([lab,fn,ghost])=>{ const b=document.createElement('button'); b.type='button'; b.textContent=lab; if(ghost) b.className='ghost'; b.onclick=async()=>{ if(fn){ const r=await fn(); if(r===false) return; } d.close(); }; f.appendChild(b); });
  $('dlgX').onclick=()=>{ const g=(buttons||[]).find(x=>x[2]); if(g&&g[1]) g[1](); d.close(); };
  if(!d.open) d.showModal();
}

// ---------- PWA ----------
(function(){
  let deferred=null;
  window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); deferred=e; $('installBtn').hidden=false; });
  $('installBtn').onclick=async()=>{ if(!deferred) return; deferred.prompt(); await deferred.userChoice; deferred=null; $('installBtn').hidden=true; };
  if('serviceWorker' in navigator&&location.protocol!=='file:'){
    let waiting=null, asked=false, reloading=false;
    navigator.serviceWorker.addEventListener('controllerchange',()=>{ if(!asked||reloading) return; reloading=true; location.reload(); });
    navigator.serviceWorker.register('sw.js').then(reg=>{
      const offer=w=>{ waiting=w; const div=document.createElement('div'); div.className='banner'; div.innerHTML='Yeni sürüm hazır. <button class="small" type="button">Kaydet ve yenile</button>'; div.querySelector('button').onclick=async()=>{ await flushSave(); asked=true; waiting.postMessage('SKIP_WAITING'); }; $('banners').prepend(div); };
      if(reg.waiting&&navigator.serviceWorker.controller) offer(reg.waiting);
      reg.addEventListener('updatefound',()=>{ const nw=reg.installing; nw.addEventListener('statechange',()=>{ if(nw.state==='installed'&&navigator.serviceWorker.controller) offer(nw); }); });
    }).catch(()=>{});
  }
})();
boot().catch(err=>{ $('main').innerHTML='<div class="empty"><h2>Arşiv açılamadı</h2><p class="err">'+esc(err.message)+'</p><p class="hint">Tarayıcının özel/gizli penceresinde veya site verisi engelliyken yerel arşiv kullanılamaz.</p></div>'; });
